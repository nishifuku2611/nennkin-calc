<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>年金所得計算サイト</title>

<style>
body {
  font-family: sans-serif;
  padding: 20px;
}

label, input, button {
  margin: 10px 0;
  display: block;
}

#result {
  margin-top: 20px;
  font-weight: bold;
}

.big-input {
  width: 300px;
  height: 70px;
  font-size: 30px;
  border: 3px solid #333;
  border-radius: 8px;
  padding: 5px 10px;
  box-sizing: border-box;
}

.big-button {
  width: 200px;
  height: 60px;
  font-size: 22px;
  padding: 10px;
  border-radius: 10px;
}

table {
  width: 100%;
  max-width: 100%;
  border-collapse: collapse;
}

table th,
table td {
  font-size: 20px;
  padding: 20px 10px;
}

#amount {
  font-size: 36px;
  font-weight: bold;
  color: #0000ff;
}

.big-radio {
  transform: scale(3.0);
  margin-right: 10px;
}

.radio-label {
  display: flex;
  align-items: center;
  font-size: 28px;
  gap: 15px;
}
</style>
</head>

<body>

<h1>年金所得の計算サイト</h1>

<label>年金収入（円）:</label>
<input type="text" id="income" class="big-input" inputmode="numeric">

<h3>年齢区分</h3>

<label class="radio-label">
  <input type="radio" name="ageKubun" value="under65" class="big-radio" checked>
  65歳未満
</label>

<label class="radio-label">
  <input type="radio" name="ageKubun" value="over65" class="big-radio">
  65歳以上
</label>

<div style="display:flex; gap:10px;">
  <button class="big-button" onclick="calculate()">計算する</button>
  <button class="big-button" onclick="clearInput()">クリア</button>
</
